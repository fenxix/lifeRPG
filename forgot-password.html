<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LifeRPG — Восстановление пароля</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D97F4F">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<style>
:root {
  --bg: #FAF3E7; --card: #FFFFFF; --card2: #F3E9D8; --border: #EDE1CC;
  --terracotta: #D97F4F; --sage: #7D9471; --gold: #C08430; --coral: #E08589;
  --text: #4A3C2F; --dim: #A8977E; --shadow: 0 6px 20px rgba(74,60,47,.08);
  --danger: #D9634F;
}
html[data-theme="dark"] {
  --bg: #241E1A; --card: #302722; --card2: #3B3129; --border: #473C33;
  --text: #F5EAE0; --dim: #B8A594; --shadow: 0 6px 20px rgba(0,0,0,.3); --gold: #E3A857;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 0; transition: background .2s, color .2s; }
.phone { width: 380px; min-height: 100vh; background: var(--bg); border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; }
.auth-header { padding: 36px 24px 20px; text-align: center; }
.auth-crest { width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 20px; background: linear-gradient(135deg, #E8A96F, var(--terracotta)); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); font-size: 24px; }
.auth-header h1 { font-size: 19px; font-weight: 800; margin: 0 0 4px; }
.sub { font-size: 12px; color: var(--dim); margin: 0; font-weight: 600; }
.auth-body { padding: 0 20px 24px; }
label { display: block; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .02em; margin: 12px 0 6px; font-weight: 700; }
input[type=email], input[type=password] { width: 100%; padding: 10px 12px; font-family: inherit; font-size: 14px; background: var(--card2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); outline: none; }
input:focus { border-color: var(--terracotta); }
.btn { font-family: inherit; font-size: 11px; font-weight: 800; padding: 9px 15px; border-radius: 12px; border: none; color: #fff; background: var(--terracotta); cursor: pointer; }
.btn-block { width: 100%; padding: 12px 0; text-align: center; margin-top: 20px; }
.btn:disabled { opacity: .5; }
.back-link { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: var(--dim); font-weight: 700; cursor: pointer; text-decoration: underline; }
.error-box { margin-top: 14px; padding: 10px 12px; font-size: 12px; font-weight: 700; background: rgba(217,99,79,.1); border: 1px solid var(--danger); color: var(--danger); border-radius: 10px; display: none; }
.success-box { margin-top: 14px; padding: 10px 12px; font-size: 12px; font-weight: 700; background: rgba(125,148,113,.12); border: 1px solid var(--sage); color: var(--sage); border-radius: 10px; display: none; }
</style>
</head>
<body>
<div class="phone">
  <div class="auth-header">
    <div class="auth-crest">🔑</div>
    <h1>Восстановление пароля</h1>
    <p class="sub">Пришлём ссылку на почту для сброса</p>
  </div>
  <div class="auth-body">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com">
    <button class="btn btn-block" id="submit-btn" onclick="sendReset()">Отправить ссылку</button>
    <div class="error-box" id="error-box"></div>
    <div class="success-box" id="success-box"></div>
    <span class="back-link" onclick="location.href='auth.html'">← Вернуться ко входу</span>
  </div>
</div>

<script>
  async function sendReset() {
    const email = document.getElementById('email').value.trim();
    const errBox = document.getElementById('error-box');
    const okBox = document.getElementById('success-box');
    errBox.style.display = 'none';
    okBox.style.display = 'none';

    if (!email) { errBox.innerText = 'Введи email.'; errBox.style.display = 'block'; return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.innerText = 'Отправляем...';

    const redirectTo = window.location.href.replace('forgot-password.html', 'reset-password.html');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

    btn.disabled = false; btn.innerText = 'Отправить ссылку';

    if (error) { errBox.innerText = error.message; errBox.style.display = 'block'; return; }
    okBox.innerText = 'Письмо отправлено! Проверь почту (и папку "Спам") и перейди по ссылке.';
    okBox.style.display = 'block';
  }
</script>
</body>
</html>
