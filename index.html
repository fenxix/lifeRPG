<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LifeRPG — Главная</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D97F4F">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<style>
:root {
  --bg: #FAF3E7; --card: #FFFFFF; --card2: #F3E9D8; --border: #EDE1CC;
  --terracotta: #D97F4F; --sage: #7D9471; --gold: #C08430; --coral: #E08589;
  --text: #4A3C2F; --dim: #A8977E; --shadow: 0 6px 20px rgba(74,60,47,.08);
  --danger: #D9634F;
}
html[data-theme="dark"] {
  --bg: #241E1A; --card: #302722; --card2: #3B3129; --border: #473C33;
  --text: #F5EAE0; --dim: #B8A594; --shadow: 0 6px 20px rgba(0,0,0,.3);
  --gold: #E3A857;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; font-family: 'Nunito', sans-serif;
  background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 0;
  transition: background .2s, color .2s;
}
.phone {
  width: 380px; min-height: 100vh; background: var(--bg);
  border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  position: relative; padding-bottom: 78px;
}
.icon-emoji { font-style: normal; display: inline-block; line-height: 1; }

.header { padding: 20px 18px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.id { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.hex-avatar { width: 48px; height: 48px; border-radius: 16px; background: linear-gradient(135deg, #E8A96F, var(--terracotta)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16px; overflow: hidden; flex-shrink: 0; }
.hex-avatar img { width: 100%; height: 100%; object-fit: cover; }
.name { font-size: 15px; font-weight: 800; }
.subname { font-size: 11px; color: var(--dim); font-weight: 600; margin-top: 1px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--dim); box-shadow: var(--shadow); font-size: 14px; cursor: pointer; flex-shrink: 0; order: 1; }
.theme-toggle-btn { order: 99; width: 38px; height: 38px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; flex-shrink: 0; }

.subheader { padding: 18px 18px 12px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); }
.back-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--dim); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: var(--shadow); }
.subheader h1 { font-size: 15px; font-weight: 800; margin: 0; }
.subheader p { font-size: 11px; color: var(--dim); margin: 2px 0 0; font-weight: 600; }

.level-card { margin: 16px 18px; padding: 18px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; }
.ring-wrap { position: relative; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--card2); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--terracotta); stroke-width: 8; stroke-linecap: round; }
.ring-fg-2 { fill: none; stroke-width: 6; stroke-linecap: round; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-center .num { font-size: 20px; font-weight: 800; }
.ring-center .lbl { font-size: 8px; color: var(--dim); font-weight: 700; text-transform: uppercase; }
.level-stats { flex: 1; min-width: 0; }
.level-stats .xp, .xp { font-size: 11px; color: var(--dim); font-weight: 700; margin-bottom: 8px; }
.stat-line { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
.stat-line .icon-emoji { width: 15px; text-align: center; font-size: 12px; }
.stat-line.gold, .gold { color: var(--gold); }
.stat-line.cyan, .cyan { color: var(--sage); }
.stat-line.streak, .streak { color: var(--coral); }
.g { color: var(--gold); font-weight: 700; }
.x { color: var(--sage); font-weight: 700; }

.attrs-row { display: flex; gap: 10px; padding: 0 18px 6px; overflow-x: auto; }
.attr-ring { flex-shrink: 0; width: 76px; text-align: center; background: var(--card); border-radius: 18px; padding: 12px 6px; box-shadow: var(--shadow); }
.attr-ring .ring-wrap { width: 52px; height: 52px; margin: 0 auto 6px; }
.attr-ring .ring-center .num { font-size: 12px; font-weight: 800; }
.lbl2 { font-size: 9px; color: var(--dim); font-weight: 700; }
.unlock { font-size: 8px; color: var(--terracotta); font-weight: 700; margin-top: 2px; }

.section { padding: 16px 18px; }
.section-title { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 800; margin-bottom: 10px; }
.section-title .count, .section-title .badge { font-size: 10px; font-weight: 700; color: var(--terracotta); background: rgba(217,127,79,.12); padding: 4px 10px; border-radius: 99px; }
.section-title .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); margin-left: 8px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.card-name { font-size: 13px; font-weight: 800; color: var(--text); }
.card-desc { font-size: 10px; color: var(--dim); margin-top: 3px; font-weight: 600; }
.card-tag { font-size: 9px; text-transform: uppercase; font-weight: 800; letter-spacing: .03em; padding: 3px 10px; border-radius: 99px; display: inline-block; margin-bottom: 6px; }
.tag-boss { background: rgba(224,133,137,.15); color: var(--coral); }
.tag-goal { background: rgba(125,148,113,.15); color: var(--sage); }

.bar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
.bar-fill-boss { height: 100%; background: linear-gradient(90deg, var(--coral), #EFA8A0); border-radius: 99px; }
.bar-fill-goal { height: 100%; background: linear-gradient(90deg, var(--sage), #A3BB93); border-radius: 99px; }
.card-num { font-size: 10px; color: var(--dim); font-weight: 700; }

.quest-card { display: flex; align-items: center; gap: 12px; padding: 13px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); margin-bottom: 10px; }
.quest-card.done { opacity: .5; }
.quest-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.quest-title { font-size: 13px; font-weight: 700; }
.quest-title.done { text-decoration: line-through; color: var(--dim); }
.quest-meta { font-size: 10px; color: var(--dim); margin-top: 3px; font-weight: 600; }

.boss-card { border-radius: 20px; padding: 16px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); }
.boss-tag { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--coral); background: rgba(224,133,137,.15); padding: 3px 10px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 10px; }
.boss-icon-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.boss-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(224,133,137,.15); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.boss-name { font-size: 14px; font-weight: 800; }
.boss-bar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-bottom: 5px; }
.boss-bar-fill { height: 100%; background: linear-gradient(90deg, var(--coral), #EFA8A0); border-radius: 99px; }
.boss-num { font-size: 10px; color: var(--dim); font-weight: 700; }

.btn, .btn-primary, .quest-btn { font-family: inherit; font-size: 11px; font-weight: 800; padding: 9px 15px; border-radius: 12px; border: none; color: #fff; background: var(--terracotta); cursor: pointer; }
.btn:disabled, .quest-btn:disabled { opacity: .4; cursor: default; }
.btn-block { width: 100%; padding: 12px 0; text-align: center; }
.btn-dashed { width: 100%; padding: 11px 0; border: 2px dashed var(--border); border-radius: 14px; background: transparent; color: var(--terracotta); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
.quest-btn { margin-left: auto; }

label { display: block; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .02em; margin: 12px 0 6px; font-weight: 700; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=time], textarea, select {
  width: 100%; padding: 10px 12px; font-family: inherit; font-size: 14px;
  background: var(--card2); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--terracotta); }
textarea { resize: none; }

.empty-note { font-size: 12px; color: var(--dim); text-align: center; padding: 14px 0; font-weight: 600; }

.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 380px; height: 70px; background: var(--card); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; z-index: 20; }
.nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--dim); font-size: 9px; font-weight: 700; cursor: pointer; font-family: inherit; }
.nav-btn .icon-emoji { font-size: 17px; }
.nav-btn.active { color: var(--terracotta); }
.nav-btn.active .icon-emoji { background: rgba(217,127,79,.14); width: 32px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

.drawer { position: fixed; inset: 0; background: rgba(74,60,47,.5); z-index: 50; display: none; justify-content: flex-end; }
.drawer.open { display: flex; }
.drawer-panel { width: 260px; height: 100%; background: var(--card); border-left: 1px solid var(--border); padding: 16px; }
.drawer-item { display: flex; align-items: center; gap: 10px; padding: 11px 10px; border-radius: 10px; color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; }
.drawer-item:hover { background: var(--card2); }

.loading { text-align: center; padding: 60px 20px; color: var(--dim); font-size: 13px; font-weight: 700; }

.switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--card2); border-radius: 10px; cursor: pointer; transition: .15s; }
.slider::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: var(--dim); border-radius: 50%; transition: .15s; }
input:checked + .slider { background: rgba(217,127,79,.3); }
input:checked + .slider::before { transform: translateX(16px); background: var(--terracotta); }

.item-row { display: flex; align-items: center; justify-content: space-between; }
.item-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; margin-right: 10px; }
.item-info { display: flex; align-items: center; }
.rarity-tag { font-size: 8px; color: var(--gold); font-weight: 800; text-transform: uppercase; }

.region-row { display: flex; align-items: center; justify-content: space-between; padding: 0; }
.region-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; margin-right: 10px; }
.region-info { display: flex; }
.region-cost { font-size: 9px; color: var(--terracotta); font-weight: 700; margin-top: 3px; }
.region-progress { margin-top: 8px; }
.timer-label { font-size: 10px; color: var(--dim); font-weight: 700; }

.kind-tabs, .tabs { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.kind-tab, .tab-btn { flex: 1; padding: 9px 0; text-align: center; font-size: 11px; text-transform: uppercase; cursor: pointer; background: transparent; color: var(--dim); border: none; font-family: inherit; font-weight: 700; }
.kind-tab.active, .tab-btn.active { background: var(--card2); color: var(--terracotta); }

.auth-header { padding: 36px 24px 20px; text-align: center; }
.auth-crest { width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 20px; background: linear-gradient(135deg, #E8A96F, var(--terracotta)); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); font-size: 24px; }
.auth-header h1 { font-size: 19px; font-weight: 800; margin: 0 0 4px; }
.sub { font-size: 12px; color: var(--dim); margin: 0; font-weight: 600; }
.auth-body { padding: 0 20px 24px; }

.modules-title { font-size: 11px; color: var(--dim); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 18px 0 8px; }
.module-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; margin-bottom: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.module-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.module-desc { font-size: 10px; color: var(--dim); margin-top: 2px; font-weight: 600; }

.error-box { margin-top: 14px; padding: 10px 12px; font-size: 12px; font-weight: 700; background: rgba(217,99,79,.1); border: 1px solid var(--danger); color: var(--danger); border-radius: 10px; display: none; }
.hint { font-size: 10px; color: var(--dim); margin-top: 6px; line-height: 1.5; font-weight: 600; }

.danger-btn { width: 100%; padding: 11px 0; border: 1px solid var(--danger); background: rgba(217,99,79,.08); color: var(--danger); border-radius: 12px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }

.profile-head { display: flex; align-items: center; gap: 12px; }
.big-avatar { width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, #E8A96F, var(--terracotta)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 800; overflow: hidden; flex-shrink: 0; }
.big-avatar img { width: 100%; height: 100%; object-fit: cover; }
.edit-btn { font-size: 10px; color: var(--terracotta); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; font-weight: 700; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
.stat-box .num { font-size: 16px; font-weight: 800; color: var(--terracotta); }
.stat-box .lbl { font-size: 9px; color: var(--dim); text-transform: uppercase; font-weight: 700; }
.skill-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
.skill-row:last-child { border-bottom: none; }
.skill-name { font-size: 12px; color: var(--text); font-weight: 700; }
.skill-desc { font-size: 9px; color: var(--dim); font-weight: 600; }
.achv-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; margin-bottom: 6px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); }
.achv-row.unlocked { border-color: var(--sage); background: rgba(125,148,113,.08); }
.achv-name { font-size: 12px; color: var(--text); font-weight: 700; }
.achv-desc { font-size: 9px; color: var(--dim); font-weight: 600; }
.log-row { display: flex; justify-content: space-between; font-size: 11px; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--dim); font-weight: 600; }
.log-row:last-child { border-bottom: none; }

.fact-card { padding: 14px; }
.fact-title { font-size: 12px; color: var(--terracotta); font-weight: 800; margin-bottom: 4px; }
.fact-text { font-size: 12px; color: var(--dim); line-height: 1.5; font-weight: 600; }

.mood-picker { display: flex; justify-content: space-between; padding: 6px 4px; }
.mood-opt { background: none; border: none; font-size: 28px; cursor: pointer; opacity: .5; transition: .15s; padding: 6px; border-radius: 12px; }
.mood-opt:hover, .mood-opt.picked { opacity: 1; background: var(--card2); }
.mood-log-row { display: flex; justify-content: space-between; font-size: 11px; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--dim); font-weight: 600; }
.mood-log-row:last-child { border-bottom: none; }

.zen-box { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px 16px; }
.breathe-circle { width: 140px; height: 140px; border-radius: 50%; background: rgba(125,148,113,.1); border: 2px solid var(--sage); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 1s ease; }
.breathe-circle.pulse { animation: pulse 4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(0.92); } 50% { transform: scale(1.08); } }
.breathe-status { font-size: 12px; letter-spacing: .04em; color: var(--sage); text-transform: uppercase; font-weight: 800; }
.breathe-timer { font-size: 11px; color: var(--dim); margin-top: 4px; font-weight: 700; }
.zen-btn { margin-top: 22px; padding: 9px 22px; border-radius: 999px; border: 1px solid var(--sage); background: rgba(125,148,113,.12); color: var(--sage); font-family: inherit; font-size: 12px; text-transform: uppercase; cursor: pointer; font-weight: 800; }

.quote-box { text-align: center; padding: 26px 18px; }
.quote-box p { font-style: italic; font-size: 16px; line-height: 1.6; margin: 0 0 10px; font-weight: 600; }
.quote-box span { font-size: 11px; color: var(--dim); font-weight: 700; }
.new-quote-btn { margin-top: 18px; font-size: 11px; color: var(--terracotta); background: none; border: none; text-decoration: underline; cursor: pointer; font-weight: 700; }

.note-row { display: flex; justify-content: space-between; align-items: flex-start; }
.note-date { font-size: 9px; color: var(--dim); font-weight: 700; }
.note-text { font-size: 13px; color: var(--text); margin-top: 4px; font-weight: 600; }
.note-del, .del-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 13px; opacity: .8; }

.gold-header { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gold); font-weight: 800; }
.streak-badge { font-size: 10px; color: var(--coral); font-weight: 800; }
.top-actions { display: flex; gap: 8px; }
.top-actions .btn { flex: 1; }


.modal-overlay { position: fixed; inset: 0; background: rgba(74,60,47,.5); z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; }

</style>
</head>
<body>
<div class="phone" id="app" style="display:none;">
  <div class="header">
    <div class="id" onclick="location.href='profile.html'">
      <div class="hex-avatar"><span id="avatar-initial">?</span></div>
      <div>
        <div class="name" id="player-name">...</div>
        <div class="subname" id="player-sub">...</div>
      </div>
    </div>
    <button class="icon-btn" onclick="toggleDrawer(true)"><span class="icon-emoji">☰</span></button>
  </div>

  <div class="level-card">
    <div class="ring-wrap">
      <svg width="84" height="84">
        <circle class="ring-bg" cx="42" cy="42" r="36"></circle>
        <circle class="ring-fg" cx="42" cy="42" r="36" stroke-dasharray="226.19" id="level-ring"></circle>
      </svg>
      <div class="ring-center"><span class="num" id="level-num">1</span><span class="lbl">Уровень</span></div>
    </div>
    <div class="level-stats">
      <div class="xp" id="xp-label">0 / 100 XP</div>
      <div class="stat-line gold"><span class="icon-emoji">🪙</span> <span id="gold-label">0</span> золота</div>
      <div class="stat-line cyan"><span class="icon-emoji">⚡</span> <span id="energy-label">0 / 0</span> энергии</div>
      <div class="stat-line streak"><span class="icon-emoji">🔥</span> Стрик <span id="streak-label">0</span> дней</div>
    </div>
  </div>

  <div class="attrs-row">
    <div class="attr-ring">
      <div class="ring-wrap">
        <svg width="56" height="56">
          <circle class="ring-bg" cx="28" cy="28" r="23"></circle>
          <circle class="ring-fg-2" cx="28" cy="28" r="23" stroke="#19D3FF" stroke-dasharray="144.5" id="endurance-ring"></circle>
        </svg>
        <div class="ring-center"><span class="num" id="endurance-num">0</span></div>
      </div>
      <div class="lbl2">Выносливость</div>
      <div class="unlock" id="endurance-unlock">—</div>
    </div>
    <div class="attr-ring">
      <div class="ring-wrap">
        <svg width="56" height="56">
          <circle class="ring-bg" cx="28" cy="28" r="23"></circle>
          <circle class="ring-fg-2" cx="28" cy="28" r="23" stroke="#FF5C7A" stroke-dasharray="144.5" id="spirituality-ring"></circle>
        </svg>
        <div class="ring-center"><span class="num" id="spirituality-num">0</span></div>
      </div>
      <div class="lbl2">Духовность</div>
      <div class="unlock" id="spirituality-unlock">—</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span>Квесты дня</span><span class="count" id="quests-count">0 активных</span></div>
    <div id="quests-preview"></div>
    <a href="quests.html" style="display:block; text-align:center; font-size:11px; color:var(--cyan); font-weight:700; text-decoration:none; margin-top:4px;">Все квесты →</a>
  </div>

  <div class="section">
    <div class="section-title"><span>Активный босс</span></div>
    <div id="boss-preview"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active"><span class="icon-emoji">🏠</span>Главная</button>
    <button class="nav-btn" onclick="location.href='quests.html'"><span class="icon-emoji">📜</span>Квесты</button>
    <button class="nav-btn" onclick="location.href='world.html'"><span class="icon-emoji">🗺️</span>Мир</button>
    <button class="nav-btn" onclick="location.href='inventory.html'"><span class="icon-emoji">🎒</span>Инвентарь</button>
    <button class="nav-btn" onclick="location.href='profile.html'"><span class="icon-emoji">👤</span>Профиль</button>
  </div>
</div>
<div class="loading" id="loading-screen">Открываем врата...</div>

<div class="drawer" id="drawer" onclick="if(event.target===this) toggleDrawer(false)">
  <div class="drawer-panel">
    <div class="drawer-item" onclick="location.href='shop.html'"><span class="icon-emoji">🏪</span> Магазин</div>
    <div class="drawer-item" onclick="location.href='plans.html'"><span class="icon-emoji">✅</span> Планы и цели</div>
    <div class="drawer-item" onclick="location.href='notes.html'"><span class="icon-emoji">📝</span> Заметки</div>
    <div id="modules-nav"></div>
    <div class="drawer-item" onclick="location.href='settings.html'"><span class="icon-emoji">⚙️</span> Настройки</div>
    <div class="drawer-item" onclick="logout()"><span class="icon-emoji">🚪</span> Выйти</div>
  </div>
</div>

<script>
  let user, profile, quests = [], boss = null;

  function ringOffset(value, max, circumference) {
    const pct = Math.max(0, Math.min(value / max, 1));
    return circumference * (1 - pct);
  }

  async function init() {
    user = await requireAuth();
    if (!user) return;

    profile = await getProfile(user.id);
    await checkDailyReset();

    const { data: q } = await sb.from('quests').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
    quests = q || [];

    const { data: b } = await sb.from('bosses').select('*').eq('user_id', user.id).order('created_at', { ascending: true }).limit(1);
    boss = (b && b[0]) || null;

    const { data: modules } = await sb.from('enabled_modules').select('*').eq('user_id', user.id).eq('enabled', true);
    renderModulesNav(modules || []);

    render();
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  async function checkDailyReset() {
    const today = new Date().toISOString().slice(0, 10);
    if (profile.last_login_date === today) return;
    if (profile.last_login_date) {
      const { data: qs } = await sb.from('quests').select('is_completed_today').eq('user_id', user.id);
      const list = qs || [];
      const uncompleted = list.filter(x => !x.is_completed_today);
      if (list.length > 0 && uncompleted.length === 0) profile.daily_streak += 1;
      else if (uncompleted.length > 0) profile.daily_streak = 0;
      await sb.from('quests').update({ is_completed_today: false }).eq('user_id', user.id);
    }
    profile.last_login_date = today;
    await saveProfileFields(user.id, { last_login_date: today, daily_streak: profile.daily_streak });
  }

  function renderModulesNav(modules) {
    const icons = { zen: ['🧘', 'Уголок Дзен', 'zen.html'], quotes: ['🪶', 'Наставления', 'quotes.html'], knowledge: ['📖', 'Уголок знаний', 'knowledge.html'], mood: ['🙂', 'Трекер настроения', 'mood.html'] };
    document.getElementById('modules-nav').innerHTML = modules.map(m => {
      const info = icons[m.module_key];
      if (!info) return '';
      return `<div class="drawer-item" onclick="location.href='${info[2]}'"><span class="icon-emoji">${info[0]}</span> ${info[1]}</div>`;
    }).join('');
  }

  function toggleDrawer(open) { document.getElementById('drawer').classList.toggle('open', open); }

  function render() {
    const p = profile;
    document.getElementById('player-name').innerText = p.nickname;
    document.getElementById('player-sub').innerText = `Искатель · Ур. ${p.level}`;
    document.getElementById('avatar-initial').innerText = p.nickname[0]?.toUpperCase() || '?';
    if (p.avatar_url) document.getElementById('id').querySelector('.hex-avatar').innerHTML = `<img src="${p.avatar_url}">`;

    document.getElementById('level-num').innerText = p.level;
    const needed = xpNeededForLevel(p.level);
    document.getElementById('xp-label').innerText = `${p.xp} / ${needed} XP`;
    document.getElementById('level-ring').setAttribute('stroke-dashoffset', ringOffset(p.xp, needed, 226.19));
    document.getElementById('gold-label').innerText = p.gold;
    document.getElementById('energy-label').innerText = `${p.energy} / ${p.max_energy}`;
    document.getElementById('streak-label').innerText = p.daily_streak;

    document.getElementById('endurance-num').innerText = p.endurance;
    document.getElementById('endurance-ring').setAttribute('stroke-dashoffset', ringOffset(p.endurance, 30, 144.5));
    const enNext = nextThreshold('endurance', p.endurance);
    document.getElementById('endurance-unlock').innerText = enNext ? `${enNext.value - p.endurance} до: ${enNext.unlocks}` : 'всё открыто';

    document.getElementById('spirituality-num').innerText = p.spirituality;
    document.getElementById('spirituality-ring').setAttribute('stroke-dashoffset', ringOffset(p.spirituality, 30, 144.5));
    const spNext = nextThreshold('spirituality', p.spirituality);
    document.getElementById('spirituality-unlock').innerText = spNext ? `${spNext.value - p.spirituality} до: ${spNext.unlocks}` : 'всё открыто';

    const pending = quests.filter(q => !q.is_completed_today);
    document.getElementById('quests-count').innerText = `${pending.length} активных`;
    const preview = quests.slice(0, 2);
    document.getElementById('quests-preview').innerHTML = preview.length === 0
      ? `<div class="empty-note">Пока нет квестов.</div>`
      : preview.map(q => `
        <div class="quest-card ${q.is_completed_today ? 'done' : ''}">
          <div class="quest-icon"><span class="icon-emoji">${q.stat === 'spirituality' ? '🧘' : '⚡'}</span></div>
          <div>
            <div class="quest-title ${q.is_completed_today ? 'done' : ''}">${q.title}</div>
            <div class="quest-meta"><span class="x">+${q.reward_xp} XP</span> · <span class="g">+${q.reward_gold} золота</span></div>
          </div>
        </div>
      `).join('');

    document.getElementById('boss-preview').innerHTML = !boss ? `<div class="empty-note">Активных боссов нет.</div>` : `
      <div class="boss-card" style="cursor:pointer" onclick="location.href='quests.html'">
        <span class="boss-tag"><span class="icon-emoji">💀</span> Босс</span>
        <div class="boss-icon-row">
          <div class="boss-icon"><span class="icon-emoji">🐉</span></div>
          <div class="boss-name">${boss.name}</div>
        </div>
        <div class="boss-bar"><div class="boss-bar-fill" style="width:${(boss.hp/boss.max_hp)*100}%"></div></div>
        <div class="boss-num">${boss.hp} / ${boss.max_hp} HP</div>
      </div>
    `;
  }

  init();
</script>
</body>
</html>
